<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 90" fill="none" stroke="#0c4a6e" stroke-width="1.5">
  <!-- Subsea trees (wells) -->
  <rect x="15" y="35" width="18" height="22" rx="2" fill="#0ea5e9" stroke="#0284c7"/>
  <rect x="15" y="55" width="18" height="22" rx="2" fill="#0ea5e9" stroke="#0284c7"/>
  <rect x="40" y="35" width="18" height="22" rx="2" fill="#0ea5e9" stroke="#0284c7"/>
  <!-- Manifold -->
  <rect x="65" y="40" width="50" height="35" rx="3" fill="#f0f9ff" stroke="#0ea5e9"/>
  <circle cx="82" cy="52" r="4" fill="#0c4a6e"/>
  <circle cx="82" cy="68" r="4" fill="#0c4a6e"/>
  <circle cx="98" cy="57" r="4" fill="#0c4a6e"/>
  <path d="M82 52 L95 57 M82 68 L90 65 L95 57" stroke="#64748b" stroke-width="1"/>
  <!-- Jumper connections from trees to manifold -->
  <path d="M33 45 L65 48" stroke="#64748b" stroke-width="2"/>
  <path d="M33 67 L65 62" stroke="#64748b" stroke-width="2"/>
  <path d="M58 45 L65 55" stroke="#64748b" stroke-width="2"/>
  <!-- Flowlines (main pipes to FPSO) -->
  <path d="M115 57 L175 57" stroke="#0ea5e9" stroke-width="5" stroke-linecap="round"/>
  <path d="M115 57 L175 57" stroke="#0c4a6e" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4"/>
  <!-- FPSO -->
  <path d="M175 35 L200 35 L202 48 L173 48 Z" fill="#1e3a5f" stroke="#0ea5e9"/>
  <rect x="182" y="25" width="15" height="12" rx="1" fill="#334155"/>
  <!-- Seabed -->
  <line x1="0" y1="80" x2="200" y2="80" stroke="#334155" stroke-width="1"/>
  <rect x="0" y="80" width="200" height="10" fill="#1e293b" opacity="0.2"/>
</svg>
